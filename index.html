<style>
@import url("https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400&display=swap");
/* Estilo de 3DPrinter: fondo claro, tarjetas blancas, azul rey, campos azul claro */
:root {
  --bg:#F3F6FC; --surface:#FFFFFF; --surface2:#EEF3FD;
  --border:#E3E9F4;
  --accent:#0038B3; --accent2:#0038B3; --accent-soft:#E6EEFC;
  --green:#15803D; --orange:#B45309; --red:#DC2626;
  --text:#0B1324; --text2:#4B5568; --text3:#8A94A6;
  --font:"Inter",sans-serif; --font-h:"Plus Jakarta Sans","Inter",sans-serif; --mono:"JetBrains Mono",monospace;
  --r-sm:12px; --r-md:14px; --r-lg:22px; --r-xl:28px;
  --shadow:0 10px 30px rgba(15,35,90,.08);
}
* { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
body { font-family:var(--font); background:var(--bg); color:var(--text); height:100dvh; overflow:hidden; }
button, input, select { font-family:var(--font); }
.hidden { display:none !important; }

/* AUTH */
.auth { min-height:100dvh; overflow-y:auto; display:flex; flex-direction:column; align-items:center; justify-content:center; padding:24px 16px; }
.auth-card { width:100%; max-width:420px; background:var(--surface); border-radius:var(--r-xl); box-shadow:var(--shadow); padding:28px 24px; display:flex; flex-direction:column; gap:14px; }
.brand { display:flex; align-items:center; justify-content:center; gap:12px; margin-bottom:10px; }
.brand .ic { width:56px; height:56px; border-radius:16px; background:var(--accent); display:flex; align-items:center; justify-content:center; box-shadow:0 8px 18px rgba(0,56,179,.3); }
.brand .nm { font-family:var(--font-h); font-weight:800; font-size:27px; line-height:1; letter-spacing:-.5px; }
.brand .nm span { color:var(--accent); }
.brand .sub { font-size:12px; font-weight:600; letter-spacing:1.4px; color:var(--text2); margin-top:4px; }
.auth-card h1 { font-family:var(--font-h); font-size:28px; font-weight:800; text-align:center; letter-spacing:-.8px; margin-top:6px; }
.auth-card p.desc { text-align:center; color:var(--text2); font-size:15px; line-height:1.4; }
.pill { display:flex; align-items:center; justify-content:center; gap:8px; background:var(--accent-soft); color:var(--accent); border-radius:999px; padding:9px 16px; font-size:13px; font-weight:600; text-align:center; }
.lbl { display:flex; justify-content:space-between; align-items:baseline; font-size:14px; font-weight:700; margin-top:6px; }
.lbl a { font-size:13px; font-weight:600; color:var(--accent); text-decoration:none; cursor:pointer; }
.inpw { position:relative; }
.inpw svg.l { position:absolute; left:14px; top:50%; transform:translateY(-50%); color:var(--text2); }
.inpw button.eye { position:absolute; right:10px; top:50%; transform:translateY(-50%); background:none; border:none; color:var(--text2); cursor:pointer; padding:6px; }
.inp { width:100%; padding:15px 46px 15px 46px; border:1.5px solid transparent; border-radius:var(--r-md); font-size:16px; background:var(--surface2); outline:none; color:var(--text); }
.inp:focus { border-color:var(--accent); background:#fff; }
.btn { width:100%; padding:15px; border:none; border-radius:var(--r-md); font-size:17px; font-weight:700; cursor:pointer; background:var(--accent); color:#fff; display:flex; align-items:center; justify-content:center; gap:10px; box-shadow:0 6px 14px rgba(0,56,179,.25); font-family:var(--font-h); }
.btn:disabled { opacity:.6; }
.btn-lite { width:100%; padding:12px; border:1.5px solid var(--border); border-radius:var(--r-md); background:var(--surface2); color:var(--accent); font-size:14px; font-weight:600; cursor:pointer; text-align:center; text-decoration:none; display:block; }
.info { background:var(--surface2); border-radius:var(--r-lg); padding:16px; font-size:14px; color:var(--text2); line-height:1.6; }
.info b { display:flex; align-items:center; gap:8px; color:var(--text); font-family:var(--font-h); font-size:15px; }
.err { color:var(--red); font-size:14px; min-height:18px; text-align:center; }
.foot { font-family:var(--mono); font-size:12px; color:var(--text3); text-align:center; margin-top:18px; max-width:360px; }

/* APP */
#app { display:none; flex-direction:column; height:100dvh; }
#app.on { display:flex; }
.top { background:var(--surface); padding:calc(env(safe-area-inset-top) + 12px) 16px 10px; border-bottom:1px solid var(--border); display:flex; align-items:center; gap:10px; }
.top .t { flex:1; }
.top .t b { font-size:20px; font-weight:800; font-family:var(--font-h); letter-spacing:-.4px; }
.top .t b span { color:var(--accent); }
.top .t div { font-size:12px; color:var(--text2); }
.top button { background:none; border:none; font-size:22px; cursor:pointer; }
.main { flex:1; overflow-y:auto; padding:14px 16px 110px; display:flex; flex-direction:column; gap:12px; }
.nav { display:flex; background:var(--surface); border-top:1px solid var(--border); padding:6px 0 calc(env(safe-area-inset-bottom) + 6px); }
.nav button { flex:1; min-width:0; background:none; border:none; display:flex; flex-direction:column; align-items:center; gap:2px; font-size:10px; font-weight:600; color:var(--text2); cursor:pointer; }
.nav button span { font-size:21px; }
.nav button.on { color:var(--accent); }
.fab { position:fixed; right:18px; bottom:calc(env(safe-area-inset-bottom) + 74px); width:58px; height:58px; border-radius:18px; border:none; background:var(--accent); color:#fff; font-size:30px; box-shadow:0 10px 22px rgba(0,56,179,.35); cursor:pointer; z-index:5; }

.chips { display:flex; gap:8px; overflow-x:auto; flex-shrink:0; min-height:36px; scrollbar-width:none; }
.chips::-webkit-scrollbar { display:none; }
.chip { padding:7px 13px; border-radius:20px; border:1.5px solid var(--border); background:var(--surface2); color:var(--text2); font-size:13px; font-weight:600; white-space:nowrap; flex-shrink:0; cursor:pointer; }
.chip.on { background:var(--accent); border-color:var(--accent); color:#fff; }
.stats { background:var(--surface); border-radius:var(--r-lg); display:flex; padding:14px 6px; box-shadow:var(--shadow); flex-shrink:0; }
.stats div { flex:1; text-align:center; }
.stats b { display:block; font-size:16px; color:var(--accent); font-family:var(--font-h); }
.stats small { font-size:11px; color:var(--text2); }
.card { background:var(--surface); border-radius:var(--r-lg); box-shadow:var(--shadow); padding:14px 16px; flex-shrink:0; }
.card h3 { font-size:15px; color:var(--text); font-family:var(--font-h); margin-bottom:6px; }
.row { display:flex; align-items:baseline; gap:8px; }
.row .n { flex:1; font-weight:700; font-size:15px; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.row .m { font-weight:800; color:var(--accent); white-space:nowrap; }
.tags { display:flex; flex-wrap:wrap; gap:5px; margin-top:6px; }
.tag { font-size:11px; padding:3px 9px; border-radius:999px; background:var(--accent-soft); color:var(--accent); font-weight:600; }
.tag.g { background:rgba(26,127,60,.12); color:var(--green); }
.tag.o { background:rgba(183,121,31,.14); color:var(--orange); }
.tag.r { background:rgba(229,56,59,.12); color:var(--red); }
.estado { font-size:13px; font-weight:700; margin-top:4px; }
.acts { display:flex; gap:8px; margin-top:10px; }
.acts button { flex:1; padding:9px; border-radius:var(--r-sm); border:none; background:var(--surface2); font-size:13px; font-weight:600; color:var(--accent); cursor:pointer; }
.acts button.del { color:var(--red); flex:0 0 46px; }
.comp { position:relative; margin-top:8px; border:1px solid var(--border); border-radius:var(--r-md); overflow:hidden; cursor:pointer; }
.comp img { width:100%; height:180px; object-fit:cover; object-position:top; display:block; background:var(--surface2); }
.comp span { position:absolute; left:0; right:0; bottom:0; padding:7px; text-align:center; font-size:13px; font-weight:700; color:#fff; background:linear-gradient(transparent,rgba(0,0,0,.65)); }
.empty { text-align:center; color:var(--text3); padding:30px 10px; font-size:14px; }
.empty span { font-size:36px; display:block; margin-bottom:6px; }
.day { font-size:13px; font-weight:700; color:var(--text2); margin:4px 2px -4px; }

/* FORM */
.sheet { position:fixed; inset:0; background:rgba(0,0,0,.35); display:none; align-items:flex-end; z-index:20; }
.sheet.on { display:flex; }
.sheet .box { background:var(--bg); width:100%; max-height:92dvh; overflow-y:auto; border-radius:22px 22px 0 0; padding:16px 16px calc(env(safe-area-inset-bottom) + 16px); display:flex; flex-direction:column; gap:10px; }
.sheet .hd { display:flex; align-items:center; }
.sheet .hd b { flex:1; font-size:18px; }
.sheet .hd button { background:none; border:none; font-size:22px; cursor:pointer; color:var(--text2); }
.f { display:flex; flex-direction:column; gap:4px; }
.f label { font-size:11px; font-weight:700; color:var(--text2); text-transform:uppercase; letter-spacing:.3px; }
.f input, .f select { padding:12px 13px; border:1.5px solid transparent; border-radius:var(--r-sm); font-size:16px; background:var(--surface2); width:100%; color:var(--text); outline:none; }
.f input:focus, .f select:focus { border-color:var(--accent); background:#fff; }
.f label { font-size:12px !important; text-transform:none !important; letter-spacing:0 !important; color:var(--text) !important; }
.g2 { display:grid; grid-template-columns:1fr 1fr; gap:10px; }
.g3 { display:grid; grid-template-columns:1fr 1fr 1fr; gap:8px; }
.pdfc { display:flex; align-items:center; gap:10px; margin-top:8px; padding:12px; border:1px solid var(--border); border-radius:var(--r-md); background:var(--surface2); color:inherit; text-decoration:none; font-weight:600; }
.pdfc b { font-size:26px; }
.prev { width:100%; max-height:200px; object-fit:contain; border-radius:var(--r-md); background:#000; }
.banner { padding:10px 14px; border-radius:var(--r-md); font-size:13px; font-weight:600; background:var(--accent-soft); color:var(--accent); }
.banner.err { background:rgba(229,56,59,.1); color:var(--red); }

.toast { position:fixed; left:16px; right:16px; bottom:calc(env(safe-area-inset-bottom) + 90px); background:#1C2530; color:#fff; padding:13px 16px; border-radius:var(--r-md); font-size:14px; text-align:center; opacity:0; pointer-events:none; transition:opacity .2s; z-index:50; }
.toast.on { opacity:1; }
.viewer { position:fixed; inset:0; background:rgba(0,0,0,.92); display:none; align-items:center; justify-content:center; z-index:60; }
.viewer.on { display:flex; }
.viewer img { max-width:100%; max-height:100%; object-fit:contain; }
</style>
</head>

let editEdo = null; // id del estado de cuenta en edición o 'nuevo'

async function revisarVersion() {

    const t = await (await fetch('/?v=' + Date.now(), { cache: 'no-store' })).text();
    const m = /const APP_VER = '([^']+)'/.exec(t);
    if (m && m[1] !== APP_VER && !$('sheet').classList.contains('on') && !$('pinSheet').classList.contains('on')) location.reload();
  } catch(e) {}

document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') revisarVersion(); });
function esc(s) { return String(s == null ? '' : s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;'); }
function toast(m) { const t = $('toast'); t.textContent = m; t.classList.add('on'); clearTimeout(t._t); t._t = setTimeout(() => t.classList.remove('on'), 2800); }
const fmt = n => '$' + (Number(n) || 0).toLocaleString('es-MX', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
const soloDigitos = v => String(v || '').replace(/\D/g, '');
const hoyDMY = () => fmtDMY(new Date());
function fmtDMY(d) { return `${String(d.getDate()).padStart(2,'0')}/${String(d.getMonth()+1).padStart(2,'0')}/${d.getFullYear()}`; }
function fechaDeDMY(f) { const m = /^(\d{1,2})\/(\d{1,2})\/(\d{4})$/.exec(String(f || '')); return m ? new Date(+m[3], +m[2]-1, +m[1]) : null; }
function validarFecha(s) {
  const m = /^(\d{1,2})\/(\d{1,2})\/(\d{4})$/.exec(String(s || '').trim());
  if (!m) return null;
  const d = new Date(+m[3], +m[2]-1, +m[1]);
  if (d.getMonth() !== +m[2]-1 || +m[3] < 2020 || +m[3] > 2100) return null;
  return fmtDMY(d);
}
function validarMonto(s) {
  const r = String(s || '').trim().replace(',', '.');
  if (!/^\d+(\.\d+)?$/.test(r)) return null;
  const n = Math.round(parseFloat(r) * 100) / 100;
  return n > 0 && n <= 10000000 ? n : null;
}
// Igual que validarMonto pero acepta 0 (recibo en $0, tarjeta sin uso). Vacío = null.
const montoOCero = txt => /^0+([.,]0*)?$/.test(String(txt || '').trim()) ? 0 : validarMonto(txt);
function normHora(h) {
  const m = /^(\d{1,2}):(\d{2})(?::\d{2})?\s*([ap])?\.?\s*m?\.?$/i.exec(String(h || '').trim());
  if (!m) return '';
  let hh = +m[1]; const ap = (m[3] || '').toLowerCase();
  if (ap === 'p' && hh < 12) hh += 12;
  if (ap === 'a' && hh === 12) hh = 0;
  return hh > 23 || +m[2] > 59 ? '' : String(hh).padStart(2,'0') + ':' + m[2];
}
const emailKey = e => String(e || '').trim().toLowerCase().replace(/\./g, ',');
function conTimeout(p, ms) { return Promise.race([p, new Promise((_, r) => setTimeout(() => r(new Error('Sin respuesta de Firebase')), ms))]); }
function tipoPago(p) {
  const t = String((p && p.tipo_pago) || '').toLowerCase();
  if (TIPOS[t]) return t;
  if (t.startsWith('serv')) return 'servicio';
  if (t.startsWith('mant')) return 'mantenimiento';
  if (t.startsWith('cole')) return 'colegiatura';
  return 'tarjeta';
}
function metodoPago(p) {
  const m = String((p && (p.metodo || p.metodo_pago)) || '').toLowerCase();
  if (m.startsWith('caj') || m.includes('efectivo') || m === 'atm') return 'cajero';
  if (m.startsWith('trans') || m === 'spei') return 'transferencia';
  return (p && (p.cuenta_origen || p.banco_origen)) ? 'transferencia' : '';
}
function normProp(v) { const s = String(v || '').toLowerCase(); return PROPIEDADES.find(p => s.includes(p.toLowerCase())) || ''; }
// Etiqueta que abre la imagen en el visor o el PDF en otra pestaña
const ligaDoc = (url, txt, cls) => !url ? `<span class="tag ${cls}">${txt}</span>`

function verImg(url) { $('viewerImg').src = url; $('viewer').classList.add('on'); }
// Comprobante guardado: PDF (liga que abre el archivo) o imagen (miniatura que abre el visor)
const esPdf = url => /\.pdf(\?|$)/i.test(decodeURIComponent(String(url || '')));

// ══ DATOS ══
// Lectura en vivo de `pagos`: lo que registre Gaby aparece al momento en el telefono de Alex.
function escuchar() {
  FB.onValue(FB.ref(FB.db, 'pagos'), snap => {
    const v = snap.val() || {};
    CATALOGO = v._catalogo || {};
    EDOCTA = v._edocta || {};
    PINES = v._pin || {};
    PAGOS = {}; RECIBOS = {};
    // Un recibo (aviso de cobro) es solo referencia del servicio: no cuenta como pagado ni se suma
    Object.entries(v).forEach(([k, p]) => { if (k[0] === '_' || !p || typeof p.cantidad !== 'number') return;
      if (p.recibo === true) { if (p.cantidad >= 0) RECIBOS[k] = p; } else if (p.cantidad > 0) PAGOS[k] = p; });
    pintar();
  }, err => {
    $('main').innerHTML = `<div class="banner err">❌ No se pudieron leer los pagos: ${esc(err.message)}</div>`;
  });
}
const ordenFecha = (a, b) => (fechaDeDMY(b.fecha) || 0) - (fechaDeDMY(a.fecha) || 0) || (b.ts || 0) - (a.ts || 0);
const listaPagos = () => Object.entries(PAGOS).map(([k, p]) => ({ _key: k, ...p })).sort(ordenFecha);
const listaRecibos = () => Object.entries(RECIBOS).map(([k, p]) => ({ _key: k, ...p })).sort(ordenFecha);
const normPeriodo = s => String(s || '').toLowerCase().replace(/[^a-z0-9]+/g, ' ').trim();

// ══ NAVEGACION ══
function ir(v) { vista = v; filtro = { ...FILTRO_INICIAL }; editCat = null; editEdo = null; pintar(); $('main').scrollTop = 0; }
function setF(k, v) { filtro[k] = v; pintar(); }
function pintar() {
  document.querySelectorAll('#nav button').forEach(b => b.classList.toggle('on', b.dataset.v === vista));
  const m = $('main');
  if (vista === 'inicio') m.innerHTML = vInicio();
  else if (vista === 'tarjetas') m.innerHTML = vPagos(p => tipoPago(p) === 'tarjeta', 'tarjetas');
  else if (vista === 'propiedades') m.innerHTML = vPropiedades();
  else if (vista === 'servicios') m.innerHTML = vCatalogo('servicio');
  else if (vista === 'colegiaturas') m.innerHTML = vCatalogo('colegiatura');
  else if (vista === 'historial') m.innerHTML = vHistorial();
  else if (vista === 'gastos') m.innerHTML = vGastos();
}
const chip = (on, onclick, txt) => `<button class="chip${on ? ' on' : ''}" onclick="${onclick}">${txt}</button>`;
const sumaMXN = arr => arr.filter(p => (p.moneda || 'MXN') === 'MXN').reduce((s, p) => s + (p.cantidad || 0), 0);

// Recibos de un número de servicio, cada uno con el pago que lo cubre (o null):
// mismo periodo, o un pago con fecha igual o posterior al recibo y antes del recibo siguiente
function recibosDe(num) {
  if (!num) return [];
  const suyos = listaPagos().filter(p => soloDigitos(p.numero_servicio) === num).map(p => ({ p, f: fechaDeDMY(p.fecha) })).filter(x => x.f).sort((a, b) => b.f - a.f);
  const rs = listaRecibos().filter(r => soloDigitos(r.numero_servicio) === num);
  return rs.map((r, i) => {
    const fr = fechaDeDMY(r.fecha), per = normPeriodo(r.periodo), sig = i > 0 ? fechaDeDMY(rs[i - 1].fecha) : null;
    const pago = suyos.map(x => x.p).find(p => per && normPeriodo(p.periodo) === per)
      || (fr ? (suyos.filter(x => x.f >= fr && (!sig || x.f < sig)).pop() || {}).p : null) || null;
    return { r, pago };
  });
}
// ── estado de un servicio / colegiatura del catalogo ──
function estadoCat(s) {
  const num = soloDigitos(s.numero);
  const suyos = listaPagos().filter(p => num && soloDigitos(p.numero_servicio) === num)
    .map(p => ({ p, f: fechaDeDMY(p.fecha) })).filter(x => x.f).sort((a, b) => b.f - a.f);
  const ultimo = suyos[0] || null;
  const hoy = new Date(); hoy.setHours(0,0,0,0);
  const meses = (FRECUENCIAS[s.frecuencia] || FRECUENCIAS.mensual).meses;
  const dia = Math.min(Math.max(parseInt(s.dia_pago, 10) || 0, 0), 31);
  let vence = null;
  if (dia) vence = new Date(hoy.getFullYear(), hoy.getMonth(), Math.min(dia, new Date(hoy.getFullYear(), hoy.getMonth()+1, 0).getDate()));
  const recibos = recibosDe(num);
  const desde = new Date(vence || hoy); desde.setMonth(desde.getMonth() - meses); desde.setDate(desde.getDate() + 1);
  let pagado = !!ultimo && ultimo.f >= desde;
  // Un recibo en $0 de este periodo no necesita pago: queda cubierto sin registrar transferencia
  const recCero = !pagado && recibos.length && recibos[0].r.cantidad === 0 && (fechaDeDMY(recibos[0].r.fecha) || 0) >= desde ? recibos[0].r : null;
  if (recCero) pagado = true;
  // Recibo pendiente con fecha límite: esa es la fecha que vale (no el día de pago del catálogo)
  if (!pagado && recibos.length && !recibos[0].pago && fechaDeDMY(recibos[0].r.vence)) vence = fechaDeDMY(recibos[0].r.vence);
  let txt, cls, dias = null;
  if (recCero) { txt = '✅ Recibo en $0 — nada que pagar'; cls = 'g'; }
  else if (pagado) { txt = '✅ Pagado'; cls = 'g'; }
  else if (!vence) { txt = '⚪ Sin día de pago'; cls = ''; }
  else {
    dias = Math.round((vence - hoy) / 86400000);
    if (dias < 0) { txt = `🔴 Vencido hace ${-dias} día${dias === -1 ? '' : 's'}`; cls = 'r'; }
    else if (dias <= 5) { txt = dias === 0 ? '🟡 Vence hoy' : `🟡 Vence en ${dias} día${dias === 1 ? '' : 's'}`; cls = 'o'; }
    else { txt = `⚪ Vence el ${fmtDMY(vence)}`; cls = ''; }
  }
  return { ultimo: ultimo && ultimo.p, recibos, comprobantes: suyos.map(x => x.p).filter(p => p.imgUrl), pagado, vence, dias, txt, cls };
}
const colorEstado = c => c === 'g' ? 'var(--green)' : c === 'r' ? 'var(--red)' : c === 'o' ? 'var(--orange)' : 'var(--text2)';

// ══ VISTA: INICIO ══
function vInicio() {
  const items = Object.entries(CATALOGO).map(([id, s]) => ({ id, s, e: estadoCat(s) }));
  const pend = items.filter(x => !x.e.pagado && x.e.vence).sort((a, b) => a.e.vence - b.e.vence);
  const pagados = items.filter(x => x.e.pagado);
  const hoy = new Date();
  const delMes = listaPagos().filter(p => { const f = fechaDeDMY(p.fecha); return f && f.getMonth() === hoy.getMonth() && f.getFullYear() === hoy.getFullYear(); });
  const porTipo = Object.keys(TIPOS).map(t => [t, delMes.filter(p => tipoPago(p) === t)]).filter(([, a]) => a.length);
  const tarjPend = estadosVigentes().filter(x => x.falta > 0);
  const porPagar = pend.reduce((s, x) => s + (parseFloat(x.s.monto) || 0), 0) + tarjPend.reduce((s, x) => s + x.falta, 0);
  let h = `<div class="stats">
      <div><b>${fmt(sumaMXN(delMes))}</b><small>Pagado en ${MESES[hoy.getMonth()]}</small></div>
      <div><b>${fmt(porPagar)}</b><small>Por pagar (aprox.)</small></div>
      <div><b>${pend.filter(x => x.e.dias < 0).length + tarjPend.filter(x => x.dias !== null && x.dias < 0).length}</b><small>Vencidos</small></div>
    </div>`;
  if (tarjPend.length) h += `<div class="card" style="cursor:pointer" onclick="ir('tarjetas')"><h3>💳 Tarjetas por pagar</h3>` + tarjPend.map(x => `
      <div style="padding:6px 0;border-top:1px solid var(--border)">
        <div class="row"><div class="n">${nombreTarjeta(x.e)}</div><div class="m">Falta ${fmt(x.falta)}</div></div>
        <div class="row"><div class="estado" style="color:${colorEstado(x.cls)};flex:1;margin:0">${x.txt}</div><div style="font-size:12px;color:var(--text2)">Abonado ${fmt(x.abonado)} de ${fmt(x.e.monto)}</div></div>
      </div>`).join('') + `</div>`;
  h += `<div class="card"><h3>📅 Próximos pagos</h3>`;
  h += pend.length ? pend.map(({ id, s, e }) => `
      <div style="padding:8px 0;border-top:1px solid var(--border)">
        <div class="row"><div class="n">${s.categoria === 'colegiatura' ? '🎓 ' + esc(s.alumno || '') + ' · ' + esc(s.servicio || '') : '💡 ' + esc(s.servicio || '') + ' · ' + esc(s.propiedad || '')}</div>
        ${s.monto ? `<div class="m">≈ ${fmt(s.monto)}</div>` : ''}</div>
        <div class="row"><div class="estado" style="color:${colorEstado(e.cls)};flex:1">${e.txt}</div>
        <button class="chip" onclick="registrarDeCatalogo('${esc(id)}')">💾 Registrar</button></div>
      </div>`).join('')
    : `<div class="empty" style="padding:10px">${items.length ? '🎉 Todo pagado por ahora' : 'Da de alta tus servicios y colegiaturas para ver aquí sus vencimientos.'}</div>`;
  h += `</div>`;
  if (pagados.length) h += `<div class="card"><h3>✅ Ya pagados este periodo (${pagados.length})</h3><div class="tags">${pagados.map(({ s }) => `<span class="tag g">${esc(s.categoria === 'colegiatura' ? (s.alumno || s.servicio) : s.servicio)} · ${esc(s.categoria === 'colegiatura' ? s.servicio : s.propiedad)}</span>`).join('')}</div></div>`;
  h += `<div class="card"><h3>💰 Pagos de ${MESES[hoy.getMonth()]} ${hoy.getFullYear()}</h3>${porTipo.length
      ? porTipo.map(([t, a]) => `<div class="row" style="padding:4px 0;margin-top:4px"><div class="n" style="font-weight:600">${TIPOS[t].icon} ${TIPOS[t].label} (${a.length})</div><div class="m">${montoResumen(a)}</div></div>`
          + ordenarPorFecha(a).map(p => detallePagoMini(p, t === 'tarjeta' ? "ir('tarjetas')" : '')).join('')).join('')
      : '<div class="empty" style="padding:10px">Sin pagos registrados este mes</div>'}</div>`;
  return h;
}

// Renglón chico con el detalle de un pago (Inicio): a quién/qué tarjeta, fecha y monto
const ordenarPorFecha = arr => arr.slice().sort((a, b) => (fechaDeDMY(b.fecha) || 0) - (fechaDeDMY(a.fecha) || 0) || (b.ts || 0) - (a.ts || 0));
function detallePagoMini(p, onclick) {
  const titulo = tituloPago(p).replace(/^\S+\s/, ''); // sin el ícono del tipo
  const extra = tipoPago(p) === 'servicio' && p.departamento ? ' · ' + esc(p.departamento) : '';
  const dia = String(p.fecha || '').slice(0, 5);
  return `<div class="row" style="padding:3px 0 3px 22px;font-size:13px;color:var(--text2)${onclick ? ';cursor:pointer' : ''}"${onclick ? ` onclick="${onclick}"` : ''}><div class="n" style="font-weight:500;min-width:0">${titulo}${extra}${dia ? ' · ' + esc(dia) : ''}</div><div class="m" style="font-weight:600">${(p.moneda || 'MXN') === 'MXN' ? fmt(p.cantidad) : esc(p.moneda) + ' ' + fmt(p.cantidad).slice(1)}</div></div>`;
}

// ══ ESTADOS DE CUENTA: lo que hay que pagar por tarjeta, menos los abonos ══
// `pagos/_edocta/{id}`: { banco, tarjeta (últ. 4), fecha_corte, fecha_limite, monto (pago para no generar intereses), minimo, minimo_msi (mínimo + compras y cargos diferidos a meses) }.
// Abonos = pagos de tarjeta a esa tarjeta con fecha DESPUÉS del corte (y hasta el corte siguiente, si ya hay uno).
const ult4 = v => soloDigitos(v).slice(-4);
function abonosDe(e, siguiente) {
  const corte = fechaDeDMY(e.fecha_corte), fin = siguiente ? fechaDeDMY(siguiente.fecha_corte) : null;
  const t4 = ult4(e.tarjeta);
  const mismoBancoUnica = Object.values(EDOCTA).filter(x => norm(x.banco) === norm(e.banco)).map(x => ult4(x.tarjeta));
  return listaPagos().filter(p => {
    if (tipoPago(p) !== 'tarjeta') return false;
    const pt = ult4(p.tarjeta);
    // sin últimos 4: cuenta solo si el banco coincide y ese banco tiene una sola tarjeta dada de alta
    if (pt ? pt !== t4 : !(norm(p.banco) === norm(e.banco) && new Set(mismoBancoUnica).size === 1)) return false;
    const f = fechaDeDMY(p.fecha);
    return f && corte && f > corte && (!fin || f <= fin);
  }).sort((a, b) => fechaDeDMY(a.fecha) - fechaDeDMY(b.fecha));
}
// Estado de cuenta vigente de cada tarjeta (el de corte más reciente) con lo abonado y lo que falta
function estadosVigentes() {
  const porTarjeta = {};
  Object.entries(EDOCTA).forEach(([id, e]) => { (porTarjeta[ult4(e.tarjeta)] = porTarjeta[ult4(e.tarjeta)] || []).push({ _id: id, ...e }); });
  const hoy = new Date(); hoy.setHours(0, 0, 0, 0);
  return Object.values(porTarjeta).map(lista => {
    lista.sort((a, b) => fechaDeDMY(b.fecha_corte) - fechaDeDMY(a.fecha_corte));
    const e = lista[0], abonos = abonosDe(e, null);
    const abonado = sumaMXN(abonos), falta = Math.max(0, Math.round(((e.monto || 0) - abonado) * 100) / 100);
    const lim = fechaDeDMY(e.fecha_limite), dias = lim ? Math.round((lim - hoy) / 86400000) : null;
    let txt, cls;
    if (!(e.monto > 0)) { txt = '✅ Sin pago este periodo (no se usó)'; cls = 'g'; }
    else if (falta <= 0) { txt = '✅ Liquidado'; cls = 'g'; }
    else if (dias === null) { txt = '⚪ Sin fecha límite'; cls = ''; }
    else if (dias < 0) { txt = `🔴 Venció hace ${-dias} día${dias === -1 ? '' : 's'}`; cls = 'r'; }
    else if (dias <= 5) { txt = dias === 0 ? '🟡 Vence hoy' : `🟡 Vence en ${dias} día${dias === 1 ? '' : 's'}`; cls = 'o'; }
    else { txt = `⚪ Vence el ${esc(e.fecha_limite)}`; cls = ''; }
    const minimoCubierto = e.minimo ? abonado >= e.minimo : null;
    return { e, abonos, abonado, falta, dias, txt, cls, minimoCubierto, otrasMonedas: abonos.filter(p => (p.moneda || 'MXN') !== 'MXN').length };

async function guardarEdo(id) {

  if (!banco) return toast('⚠️ Escribe el banco');
  if (tarjeta.length !== 4) return toast('⚠️ La tarjeta son los últimos 4 dígitos');
  const corte = validarFecha(val('e_corte')), limite = validarFecha(val('e_limite'));
  if (!corte) return toast('⚠️ Fecha de corte inválida (DD/MM/AAAA)');
  if (!limite) return toast('⚠️ Fecha límite inválida (DD/MM/AAAA)');
  if (fechaDeDMY(limite) < fechaDeDMY(corte)) return toast('⚠️ La fecha límite es antes del corte');

  const montoTxt = val('e_monto');

  if (monto === null) return toast('⚠️ Escribe el pago para no generar intereses (0 si no se usó)');

  if (minimo_msi && minimo_msi > monto) return toast('⚠️ Mínimo + meses no puede ser mayor que el pago para no generar intereses');
  if (minimo && minimo_msi && minimo > minimo_msi) return toast('⚠️ El pago mínimo no puede ser mayor que mínimo + meses');
  const repetido = Object.entries(EDOCTA).find(([k, x]) => k !== id && ult4(x.tarjeta) === tarjeta && x.fecha_corte === corte);

// ══ VISTA: GASTOS DE NOTESCANNER (solo lectura, en vivo) ══
// Lee `records` de NoteScanner con la cuenta de NoteScanner de quien entra. Las
// monedas extranjeras se pasan a pesos con el tipo de cambio de cada día (BCE).
const NS_BASE = 'Mérida';   // ciudad de casa: lo gastado en otra ciudad cuenta como viaje
const NS_MONEDAS = ['USD', 'EUR', 'GBP'];
const NSG = { user: null, estado: 'sin-sesion', recs: [], err: '', unsub: null, soloPropios: false, opciones: { persona: [], pais: [], ciudad: [], categoria: [] } };
const TC = {};              // { USD: { desde, hasta, rates: { 'AAAA-MM-DD': 18.7 } } }
const norm = s => String(s == null ? '' : s).normalize('NFD').replace(/[̀-ͯ]/g, '').toLowerCase().replace(/\s+/g, ' ').trim();
const isoDe = d => d ? `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}` : '';
function repintarGastos() { if (vista === 'gastos') pintar(); }

document.addEventListener('ns-auth', e => {
  const u = e.detail;
  if (NSG.unsub) { NSG.unsub(); NSG.unsub = null; }
  NSG.user = u; NSG.recs = []; NSG.err = ''; NSG.soloPropios = false;
  NSG.estado = u ? 'cargando' : 'sin-sesion';
  nsEscuchar();
  repintarGastos();
});
function nsEscuchar() {
  if (NSG.unsub || !userName || !NSG.user) return;
  NSG.estado = 'cargando';
  const r = FB.ref(NS.db, 'records');
  const ok = snap => {
    const v = snap.val() || {};
    // `pais` y `ciudad` ya vienen depurados en NoteScanner; si un gasto nuevo no los trae, se usa el lugar tal cual.
    NSG.recs = Object.entries(v).filter(([, x]) => x && Number(x.cantidad) > 0)
      .map(([k, x]) => ({ _key: k, ...x, _ciudad: x.ciudad || String(x.lugar || '').trim(), _pais: x.pais || '',
        // categoría y subcategoría vienen depuradas de NoteScanner; un gasto sin ellas cae en "Sin categoría" con su tipo original.
        _cat: x.categoria || 'Sin categoría', _sub: x.subcategoria || String(x.tipo || '').trim() }));
    NSG.estado = 'listo'; NSG.err = '';
    repintarGastos();
    nsTiposCambio().then(cambio => { if (cambio) repintarGastos(); });
  };
  const fallo = err => { NSG.unsub = null; NSG.estado = 'error'; NSG.err = err && err.message || String(err); repintarGastos(); };
  NSG.unsub = FB.onValue(r, ok, err => {
    // Sin permiso de "ver todo" en NoteScanner: solo los gastos propios.
    NSG.unsub = null;
    if (NSG.soloPropios) return fallo(err);
    NSG.soloPropios = true;
    NSG.unsub = FB.onValue(NS.query(r, NS.orderByChild('who'), NS.equalTo(userName)), ok, fallo);
  });
}
async function nsConectar() {

// ── tipos de cambio (Frankfurter / Banco Central Europeo), guardados en el teléfono ──
function tcCache(m) { try { return JSON.parse(localStorage.getItem('fbp_tc_' + m) || 'null'); } catch(e) { return null; } }
async function nsTiposCambio() {
  let cambio = false;
  const hoyIso = isoDe(new Date());
  for (const m of NS_MONEDAS) {
    const fechas = NSG.recs.filter(r => r.moneda === m).map(r => isoDe(fechaDeDMY(r.fecha))).filter(Boolean).sort();
    if (!fechas.length) continue;
    const d0 = new Date(fechas[0] + 'T12:00:00');
    d0.setDate(d0.getDate() - 7);   // margen para fines de semana y festivos
    const desde = isoDe(d0), hasta = fechas[fechas.length - 1] > hoyIso ? hoyIso : fechas[fechas.length - 1];
    let c = TC[m] || tcCache(m);
    if (c && c.desde <= desde && c.hasta >= hasta) { if (!TC[m]) { TC[m] = c; cambio = true; } continue; }
    try {
      const res = await fetch(`https://api.frankfurter.dev/v1/${desde}..${hasta}?base=${m}&symbols=MXN`);
      if (!res.ok) throw new Error('HTTP ' + res.status);
      const j = await res.json();
      const rates = {};
      Object.entries(j.rates || {}).forEach(([d, x]) => { if (x && x.MXN > 0) rates[d] = x.MXN; });
      c = { desde, hasta, rates };
      try { localStorage.setItem('fbp_tc_' + m, JSON.stringify(c)); } catch(e) {}
    } catch(e) { console.warn('[tipo de cambio]', m, e); }
    if (c) { TC[m] = c; cambio = true; }
  }
  return cambio;
}
// Tipo de cambio del día o, si ese día no hubo (fin de semana), el último anterior.
function tasa(m, fecha) {
  const c = TC[m]; const d = fechaDeDMY(fecha);
  if (!c || !d) return null;
  for (let i = 0; i < 8; i++) { const r = c.rates[isoDe(d)]; if (r) return r; d.setDate(d.getDate() - 1); }
  return null;
}
function enPesos(r) {
  const m = r.moneda || 'MXN', n = Number(r.cantidad) || 0;
  if (m === 'MXN') return n;
  const t = tasa(m, r.fecha);
  return t ? Math.round(n * t * 100) / 100 : null;
}

// Agrupa sin importar acentos ni mayúsculas; muestra la forma más usada.
function agrupar(arr, campo, vacio) {
  const g = {};
  arr.forEach(r => {
    const txt = String(r[campo] || '').trim(), k = norm(txt) || '~';
    const x = g[k] = g[k] || { k, nombres: {}, recs: [] };
    x.nombres[txt || vacio] = (x.nombres[txt || vacio] || 0) + 1;
    x.recs.push(r);
  });
  return Object.values(g).map(x => ({ ...x, nombre: Object.entries(x.nombres).sort((a, b) => b[1] - a[1])[0][0], total: sumaPesos(x.recs) }))
    .sort((a, b) => b.total - a.total);
}
const sumaPesos = arr => Math.round(arr.reduce((s, r) => s + (enPesos(r) || 0), 0) * 100) / 100;
const filaG = (txt, arr, onclick = '') => `<div class="row" style="padding:6px 0;border-top:1px solid var(--border)${onclick ? ';cursor:pointer' : ''}"${onclick ? ` onclick="${onclick}"` : ''}><div class="n" style="font-weight:600">${txt} <span style="font-weight:500;color:var(--text2)">(${arr.length})</span></div><div class="m">${fmt(sumaPesos(arr))}</div></div>`;

// ── PIN de 4 dígitos para eliminar (no es la contraseña de la app) ──
// Se guarda solo el hash (PBKDF2) en pagos/_pin/{uid}. Crearlo o cambiarlo pide la contraseña de la app.
let pinFallos = 0;
function pedirClave(titulo, esPin, olvide) {
  return new Promise(res => {
    const fin = v => { $('pinSheet').classList.remove('on'); res(v); };
    $('pinBox').innerHTML = `<div class="hd"><b style="font-size:16px">${titulo}</b><button id="pinX">✕</button></div>
      <div class="f">${esPin ? '<input id="pinIn" type="password" inputmode="numeric" maxlength="4" autocomplete="off" style="font-size:28px;letter-spacing:14px;text-align:center">'
        : `<div class="inpw"><input id="pinIn" type="password" autocomplete="current-password" autocapitalize="none" autocorrect="off" spellcheck="false" placeholder="Contraseña con la que entras" style="padding-right:46px"><button class="eye" type="button" onclick="const i=$('pinIn');i.type=i.type==='password'?'text':'password'" aria-label="Mostrar contraseña"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></svg></button></div>`}</div>
      <button class="btn" id="pinOk">Aceptar</button>${olvide ? `<button class="btn-lite" id="pinOlv">${esPin ? '¿Olvidaste tu PIN?' : '¿Olvidaste tu contraseña?'}</button>` : ''}`;
    $('pinX').onclick = () => fin(null);
    $('pinOk').onclick = () => fin($('pinIn').value);
    $('pinIn').onkeydown = e => { if (e.key === 'Enter') fin($('pinIn').value); };
    if (esPin) $('pinIn').oninput = e => { e.target.value = e.target.value.replace(/\D/g, '').slice(0, 4); if (e.target.value.length === 4) fin(e.target.value); };
    if (olvide) $('pinOlv').onclick = () => fin('__olvide');
    $('pinSheet').onclick = e => { if (e.target === $('pinSheet')) fin(null); };
    $('pinSheet').classList.add('on');
    setTimeout(() => $('pinIn').focus(), 50);
  });
}
async function hashPin(pin, salt) {
  const enc = new TextEncoder();
  const k = await crypto.subtle.importKey('raw', enc.encode(pin), 'PBKDF2', false, ['deriveBits']);
  const b = await crypto.subtle.deriveBits({ name: 'PBKDF2', hash: 'SHA-256', salt: enc.encode(salt), iterations: 150000 }, k, 256);
  return btoa(String.fromCharCode(...new Uint8Array(b)));
}
async function autorizarBorrado(que) {
  const u = FB.auth.currentUser; if (!u) return false;
  const mio = PINES[u.uid];
  if (mio && mio.hash && mio.salt && pinFallos < 5) {
    const pin = await pedirClave('🔒 PIN para eliminar ' + que, true, true);
    if (pin === null) return false;
    if (pin !== '__olvide') {
      if (await hashPin(pin, mio.salt) === mio.hash) { pinFallos = 0; return true; }
      pinFallos++; toast(pinFallos >= 5 ? '🔒 Demasiados intentos: la próxima vez se pide la contraseña' : '❌ PIN incorrecto'); return false;
    }
  }
  // Crear o restablecer el PIN: primero la contraseña de la app
  const pass = await pedirClave(`🔑 Paso 1 de 2: escribe la CONTRASEÑA con la que entras a la app (${esc(u.email)}). El PIN lo ${mio ? 'cambias' : 'creas'} en el paso 2.`, false, true);
  if (!pass) return false;
  if (pass === '__olvide') {
    try { await FB.sendPasswordResetEmail(FB.auth, u.email); toast('📧 Te mandamos un correo a ' + u.email + ' para cambiar la contraseña'); }
    catch(e) { toast('❌ ' + (e.code || e.message)); }
    return false;
  }
  try { await FB.reauthenticateWithCredential(u, FB.EmailAuthProvider.credential(u.email, pass)); }
  catch(e) {
    console.warn('[PIN] reauth', e.code, e.message);
    const c = e.code || '';
    toast(/wrong-password|invalid-credential|invalid-login-credentials/.test(c)
      ? (/^d{4}$/.test(pass) ? '❌ Ahí va la contraseña con la que entras a la app, no el PIN' : '❌ Esa no es la contraseña con la que entras a la app')
      : '❌ No se pudo verificar (' + (c || e.message) + ')');
    return false;
  }
  const p1 = await pedirClave('🔢 Escribe tu nuevo PIN de 4 dígitos', true, false);
  if (!p1) return false;
  if (!/^\d{4}$/.test(p1)) { toast('⚠️ El PIN son 4 números'); return false; }
  const p2 = await pedirClave('🔢 Repite el PIN', true, false);
  if (p2 !== p1) { toast('❌ Los PIN no coinciden'); return false; }
  const salt = Array.from(crypto.getRandomValues(new Uint8Array(16)), b => b.toString(16).padStart(2, '0')).join('');
  try { await FB.update(FB.ref(FB.db), { ['pagos/_pin/' + u.uid]: { salt, hash: await hashPin(p1, salt), ts: Date.now() } }); }
  catch(e) { toast('❌ No se pudo guardar el PIN: ' + e.message); return false; }
  pinFallos = 0; toast('✅ PIN guardado'); return true;
}
async function borrarPago(key) {
  const p = PAGOS[key] || RECIBOS[key]; if (!p) return;
  if (!await autorizarBorrado(`${p.recibo ? 'el recibo' : 'el pago'} de ${fmt(p.cantidad)}`)) return;

}

async function guardarCat(id, categoria) {

  if (!servicio) return toast(esCole ? '⚠️ Escribe la escuela' : '⚠️ Escribe el servicio');
  if (!esCole && !PROPIEDADES.includes(propiedad)) return toast('⚠️ Elige la propiedad');
  if (!numero) return toast(esCole ? '⚠️ Escribe la referencia o matrícula' : '⚠️ Escribe el número de servicio');
  const dia = val('c_dia');
  if (dia && !(+dia >= 1 && +dia <= 31)) return toast('⚠️ Día de pago entre 1 y 31');

  const repetido = Object.entries(CATALOGO).find(([k, s]) => k !== id && soloDigitos(s.numero) && soloDigitos(s.numero) === soloDigitos(numero));
  if (repetido) return toast('⚠️ Ese número ya está dado de alta (' + repetido[1].servicio + ')');
  const data = { categoria, servicio, propiedad, alumno, numero, dia_pago: dia ? parseInt(dia, 10) : null,

// ── foto + IA ──
function compressImage(dataUrl, maxBytes, quality) {
  return new Promise(resolve => {
    const img = new Image();
    img.onload = () => {
      const intento = maxDim => {
        let w = img.width, h = img.height;
        if (w > maxDim || h > maxDim) { const r = Math.min(maxDim / w, maxDim / h); w = Math.round(w * r); h = Math.round(h * r); }
        const c = document.createElement('canvas'); c.width = w; c.height = h; c.getContext('2d').drawImage(img, 0, 0, w, h);
        let q = quality, out;
        do { out = c.toDataURL('image/jpeg', q); q -= 0.1; } while (Math.round((out.length - 22) * 3 / 4) > maxBytes && q >= 0.3);
        return out;
      };
      let r = intento(1600);
      if (Math.round((r.length - 22) * 3 / 4) > maxBytes) r = intento(1200);
      if (Math.round((r.length - 22) * 3 / 4) > maxBytes) r = intento(900);
      resolve(r);
    };
    img.src = dataUrl;
  });
}
// El proxy de IA acepta hasta 5 MB por petición (base64 crece 4/3): PDF de máximo 3.5 MB.
const MAX_PDF = 3.5 * 1024 * 1024;
function onFoto(input) {

      $('rMsg').innerHTML = '<div class="banner">🤖 Leyendo el PDF…</div>';

async function leerConIA(b64, mime = 'image/jpeg') {
  const prompt = `Analiza este comprobante de PAGO o RECIBO (por ejemplo el recibo de luz de CFE) y responde ÚNICAMENTE con JSON válido, sin markdown.
Tipos (tipo_pago):
- "tarjeta": pago a una tarjeta de crédito (PAGO DE TARJETA, PAGO APLICADO, abono a tarjeta) o una transferencia/SPEI enviada desde la app del banco para pagar una tarjeta.
- "servicio": recibo o pago de CFE (luz), agua (JAPAY, CONAGUA u organismo de agua), teléfono/internet/cable (Telmex, Telcel, AT&T, Izzi, Totalplay, Megacable), gas, predial.
- "mantenimiento": cuota de mantenimiento o administración de edificio/condominio (Arthouse, Townsquare).
- "colegiatura": pago a escuela, colegio, universidad (colegiatura, inscripción, matrícula).
- "otro": cualquier otro pago.
PRIMERO decide "documento" (OBLIGATORIO):
- "recibo": RECIBO o aviso de cobro que manda el servicio para cobrar; NO prueba que se pagó. Señales: "TOTAL A PAGAR", "PERIODO FACTURADO", "fecha límite de pago", "corte a partir de", historial de consumo (kWh, m3), datos del medidor o tarifa, código de barras para pagar. El recibo de luz de CFE, el de agua (JAPAY) y el estado de cuenta de Telmex/Izzi son "recibo", aunque digan "domiciliado" o "recurrente" o el total sea $0.
- "pago": comprobante de que el dinero YA salió: captura de transferencia/SPEI, ticket de cajero o de caja, "PAGADO", "operación exitosa", número de autorización o clave de rastreo, cuenta de origen.
Si dudas, es "recibo".
Si es recibo: "total" es el TOTAL A PAGAR (si dice $0 por saldo a favor, subsidio o sin consumo pon "0"), "fecha" es la fecha de emisión o corte del recibo, "periodo" el periodo facturado y "fecha_limite" la fecha límite de pago; OMITE los datos de banco.
Responde con este JSON exacto (OMITE campos vacíos, JSON compacto en una línea):
{"documento":"recibo o pago","tipo_pago":"","fecha":"DD/MM/YYYY con año de 4 dígitos (13/nov/26 -> 13/11/2026)","hora":"HH:MM 24h","total":"número sin comas","moneda":"MXN o USD o EUR o GBP","metodo_pago":"transferencia (captura de app/banca en línea/SPEI) o cajero (ticket de cajero/practicaja, efectivo)","banco":"banco DESTINO o de la tarjeta","banco_origen":"banco desde el que salió el dinero","cuenta_origen":"últimos 4 de la cuenta origen","tarjeta_pagada":"últimos 4 de la tarjeta/cuenta destino","servicio":"empresa o escuela que recibe (CFE, Telmex, Agua, Colegio X, Administración Arthouse)","numero_servicio":"número de servicio, línea telefónica, contrato o matrícula","periodo":"periodo pagado ej Nov 2026","fecha_limite":"DD/MM/YYYY si aparece","departamento":"Casa, Arthouse o Townsquare si aparece","alumno":"nombre del alumno si es colegiatura","folio":"autorización, folio o referencia","concepto":"concepto"}`;
  try {
    const body = JSON.stringify({ model: 'claude-sonnet-4-6', max_tokens: 1024, messages: [{ role: 'user', content: [
      mime === 'application/pdf'
        ? { type: 'document', source: { type: 'base64', media_type: 'application/pdf', data: b64 } }
        : { type: 'image', source: { type: 'base64', media_type: 'image/jpeg', data: b64 } },
      { type: 'text', text: prompt } ] }] });
    // claude-proxy solo atiende a miembros con sesión (token de Auth + App Check)
    const headers = { 'Content-Type': 'application/json' };
    const u = FB.auth.currentUser;
    if (u) { try { headers['Authorization'] = 'Bearer ' + await u.getIdToken(); } catch(e) { console.warn('[IA] sin token de sesión', e); } }
    if (FB.appCheck) {
      try { const t = await FB.getAppCheckToken(FB.appCheck, false); if (t && t.token) headers['X-Firebase-AppCheck'] = t.token; }
      catch(e) { console.warn('[IA] sin token de App Check', e); }
    }
    let res;
    for (let i = 1; ; i++) {
      try { res = await fetch('/.netlify/functions/claude-proxy', { method: 'POST', headers, body }); break; }
      catch(e) { if (i >= 2) throw e; await new Promise(r => setTimeout(r, 1500)); }
    }
    if (!res.ok) throw new Error('IA respondió ' + res.status);
    const data = await res.json();
    const txt = ((data.content || []).find(b => b.type === 'text') || {}).text || '';
    const clean = txt.replace(/```json|```/gi, '');
    const d = JSON.parse(clean.substring(clean.indexOf('{'), clean.lastIndexOf('}') + 1));
    if (d.total != null) d.total = String(d.total).replace(/[^0-9.]/g, ''); // "$0" o "1,234.00" -> número
    if (!/^(recibo|pago)$/.test(d.documento || '')) d.documento = (d.fecha_limite || d.periodo) && !d.banco_origen && !d.cuenta_origen ? 'recibo' : 'pago';

    $('rForm').outerHTML = formPago(d);
    $('rFoto').innerHTML = fotoHtml;
    actualizarCampos();
    mostrarForm();
    autocompletar(false);
    $('rMsg').innerHTML = `<div class="banner">✅ ${esRecibo() ? '📄 Recibo (no es pago) de ' : ''}${TIPOS[tipoPago(d)].icon} ${TIPOS[tipoPago(d)].label} detectado — revisa y guarda</div>`;
  } catch(e) {
    console.warn('[IA]', e);
    $('rMsg').innerHTML = `<div class="banner err">⚠️ No se pudo leer con IA (${esc(e.message)}). Llena los datos a mano.</div>`;
    mostrarForm();
  }
}
function b64toBlob(b64, mime) { const s = atob(b64), a = new Uint8Array(s.length); for (let i = 0; i < s.length; i++) a[i] = s.charCodeAt(i); return new Blob([a], { type: mime }); }
async function subirFoto() {

  const r = FB.sRef(FB.storage, `pagos/${Date.now()}_${userName}.${pdf ? 'pdf' : 'jpg'}`);
  await Promise.race([FB.uploadBytes(r, b64toBlob(foto, fotoMime), { contentType: fotoMime }), new Promise((_, rej) => setTimeout(() => rej(new Error('Timeout subiendo ' + (pdf ? 'PDF' : 'imagen'))), pdf ? 45000 : 20000))]);

    vista = tipo === 'tarjeta' ? 'tarjetas' : tipo === 'colegiatura' ? 'colegiaturas' : (tipo === 'otro' ? 'historial' : 'propiedades');
    if (tipo === 'colegiatura') vista = 'colegiaturas';
    if (recibo) vista = tipo === 'colegiatura' ? 'colegiaturas' : 'servicios';
    pintar();
  } catch(e) {
    toast('❌ ' + (/permission/i.test(e.message) ? 'Firebase no permite guardar en "pagos" (reglas)' : e.message));
  } finally { btn.disabled = false; btn.textContent = recibo ? '💾 Guardar recibo' : '💾 Guardar pago'; }
}
</script>
</body>
</html>
